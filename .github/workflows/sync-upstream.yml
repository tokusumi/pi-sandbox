name: Sync upstream releases
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/carderne/pi-sandbox.git
          git fetch upstream '+refs/tags/*:refs/upstream/tags/*'
      - id: release
        run: node scripts/upstream.ts plan
      - if: steps.release.outputs.target != ''
        env:
          BASE: ${{ steps.release.outputs.base }}
          TARGET: ${{ steps.release.outputs.target }}
        run: |
          branch="sync/upstream-$TARGET"
          if [ "$(gh pr list --state open --head "$branch" --json number --jq length)" != 0 ]; then exit 0; fi
          git checkout -b "$branch"
          # Squash merges lose upstream ancestry. Record the already imported base
          # on this temporary branch before merging the next release normally.
          git merge -s ours --no-edit "refs/upstream/tags/$BASE"
          git merge --no-edit "refs/upstream/tags/$TARGET"
          pnpm install --frozen-lockfile
          pnpm run ci:fmt
          pnpm run ci:lint
          pnpm run ci:check
          pnpm run ci:test
          # The latest release may already be present when bootstrapping a fork.
          if git diff --quiet origin/main HEAD; then
            git checkout main
            UPSTREAM_TAG="$TARGET" node scripts/upstream.ts tag
            exit 0
          fi
          git push origin "HEAD:refs/heads/$branch"
          printf 'Upstream release: %s\nCurrent fork base: %s\n\nLocal patch retained:\n- automatic linked-worktree Git metadata session permissions\n\nValidation: formatting, lint, typecheck and tests passed in this workflow.\nMerge using squash after successful CI.\n' "$TARGET" "$BASE" > /tmp/upstream-pr.md
          gh pr create --base main --head "$branch" --title "chore: sync upstream $TARGET" --body-file /tmp/upstream-pr.md
